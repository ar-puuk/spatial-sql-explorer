name: Deploy web app to GitHub Pages

# The web app (apps/web) at https://ar-puuk.github.io/spatial-sql-explorer/.
# Deployed by GitHub Actions (repo Settings > Pages > Source: GitHub Actions):
# build, upload the static build as a Pages artifact, deploy it. No gh-pages
# branch. The SQL engine is not in the build: the app downloads it from pinned
# URLs and checks its hashes (packages/core/src/engineAssets.ts).

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/web/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push queues behind a running deployment
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and core tests
        run: |
          npm run lint
          npm run test:core

      - name: Build
        run: npm run build --workspace=apps/web
        env:
          # The app is served under /<repo>/ (vite.config.ts reads BASE_PATH).
          BASE_PATH: /spatial-sql-explorer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
